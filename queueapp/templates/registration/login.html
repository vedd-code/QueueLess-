
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QueueLess</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 16px; width: min(350px, 80%); box-shadow: 0 5px 20px #0001; }
        h1 { color: #2563eb; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="box">
        <h1>QueueLess</h1>
        <h2>Login to Book a Token</h2>
        {% if form.errors %}
            <p>Incorrect username or password. Please try again.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <input type="hidden" name="next" value="/">
            <button type="submit">Login</button>
        </form>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
